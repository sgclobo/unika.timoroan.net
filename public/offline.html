<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unika Online - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(160deg, #f8fafc, #e2e8f0);
        color: #0f172a;
      }
      main {
        width: min(92vw, 420px);
        background: #ffffff;
        border: 1px solid #dbeafe;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(2, 132, 199, 0.12);
      }
      img {
        width: 68px;
        height: 68px;
        border-radius: 14px;
        object-fit: cover;
      }
      h1 {
        margin: 14px 0 10px;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        color: #334155;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/images/icon.png" alt="Unika Online" />
      <h1>You are offline</h1>
      <p>
        Unika Online can still open previously visited pages and cached assets.
        Reconnect to sync products, cart, and fresh updates.
      </p>
    </main>
  </body>
</html>
